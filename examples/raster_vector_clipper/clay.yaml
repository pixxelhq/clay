# yaml-language-server: $schema=https://pixxelhq.github.io/clay/schema/v1.json
apiVersion: clay/v1
kind: block
type: processing
name: rastervectorclipper
version: 0.0.1
author: <your-email>
tags:
  - imagery
  - processing
  - testing
  - clipping

parameters: # block initialization params
  - name: buffer_distance
    type: float
    default: 0.0
    description: Optional buffer distance to apply to vector geometry before clipping

inputs:
  - name: input_raster
    format: raster
    is_artifact: true
    type: url
    description: Input raster file (GeoTIFF) to be clipped

  - name: input_vector
    format: vector
    is_artifact: true
    type: url
    description: Input vector file (GeoJSON) defining clipping geometry

outputs:
  - name: clipped_raster
    format: raster
    is_artifact: true
    type: url
    description: Clipped raster output

  - name: output_vector
    format: vector
    is_artifact: true
    type: url
    description: Original vector geometry used for clipping

build:
  python-version: "3.10"
  conda: false
  gdal: true
  apt-get:
    - wget
    - libexpat1 # needed by the rasterio and fiona wheels when gdal is false
  requirements: requirements.txt

gpu: false

env:
  SAMPLE_ENV: "sample"
