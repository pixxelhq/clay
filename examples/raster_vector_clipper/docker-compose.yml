version: "3.8"

services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio_storage:/data
    command: server --console-address ":9001" /data
    env_file:
      - .env
    restart: always

  minio-setup:
    image: minio/mc
    depends_on:
      - minio
    volumes:
      - ./assets:/tmp/inputs
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set s3minio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb s3minio/clayrunner;
      /usr/bin/mc cp --recursive /tmp/inputs s3minio/clayrunner;
      exit 0;
      "

  block:
    build:
      context: "../../"
      secrets:
        - CODEARTIFACT_AUTH_TOKEN
      dockerfile: api-test/raster_vector_clipper/Dockerfile
    image: raster-vector-clipper:latest
    container_name: raster-vector-clipper
    env_file:
      - .env

networks:
  app-network:
    driver: bridge

volumes:
  minio_storage:

secrets:
  CODEARTIFACT_AUTH_TOKEN:
    file: ../../
