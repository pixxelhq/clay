kind: block
type: processing
name: DemoClay
version: 0.0.1
title: <Title for model to be displayed on the platform>
status: draft
description: describe the model
author: <please-fill-in-here>@pixxel.co.in
tags:
  - imagery
  - processing

resources:
  cpu:
    min: 1200m
    max: 4000m
  mem:
    min: 1200Mi
    max: 4000Mi
  gpu:
    min: 0
    max: 0

parameters: # model initialization params
  - name: param1
    type: string
    default: default string
  - name: param2
    type: float
    default: 1.0

inputs:
  - name: input1
    format: raster
    type: url
    properties:
      source: planetary
      collection: sentinel2a
      dtype: uint16
      bands:
        - B04
        - B03
        - B02
    is_artifact: true

  - name: input2
    format: vector
    type: url
    properties:
      geometry: Polygon
    is_artifact: true

  - name: input3
    format: date
    type: str
    properties:
      from_aoi: false

  - name: input4
    format: string
    type: str

  - name: input5
    format: number
    type: int

  - name: input6
    format: tabular
    type: url


outputs:
  - name: output1
    format: raster
    type: url
    properties:
      source: planetary
      collection: sentinel2a
      dtype: uint16
      bands:
        - B04
        - B03
        - B02
    is_artifact: true

  - name: output2
    format: vector
    type: url
    properties:
      geometry: Polygon
    is_artifact: true

build:
  python-version: "3.10"
  conda: false
  gdal: true
  apt-get:
    - wget
  requirements: #requirements.txt  or conda.yaml

runtime_opts:
  image: REDACTED.dkr.ecr.us-east-2.amazonaws.com/democlay:sample-version
  K8sJobConfig: null
  gpu: false

options:
  dry_run: null
  preview: null
  generate_k8s_spec: true

catalog_content_url: "" # model description url
