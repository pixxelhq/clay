  // Actual date data/URL
  optional string value = 10 [default = ""];
  // Area covered by the date data in sq meters
  optional double area = 11;
  // Source information
  optional AssetSource asset_source = 12;
  // Date-specific properties
  optional DateProperties properties = 13;
