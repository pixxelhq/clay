// RasterValidation defines area validation rules for rasters
message RasterValidation {
  // Minimum allowed area in square meters
  optional double min_area = 1;
  // Maximum allowed area in square meters
  optional double max_area = 2;
}

// VectorValidation defines area validation rules for vectors
message VectorValidation {
  // Minimum allowed area in square meters
  optional double min_area = 1;
  // Maximum allowed area in square meters
  optional double max_area = 2;
}

// TabularValidation defines validation rules for tabular data
message TabularValidation {
  // Currently no validation fields
}

// DateValidation defines validation rules for dates
message DateValidation {
  // Currently no validation fields
}

// StringValidation defines validation rules for strings
message StringValidation {
  // Regular expression pattern to validate string values
  optional string regex_match = 1;
  // List of allowed values (enum constraint)
  repeated string allowed_values = 2;
}

// NumberValidation defines validation rules for numbers
message NumberValidation {
  // Minimum allowed value
  optional double min_value = 1;
  // Maximum allowed value
  optional double max_value = 2;
  // List of allowed values (enum constraint)
  repeated double allowed_values = 3;
}
