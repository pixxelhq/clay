[tool.ruff]
exclude = ["*env", ".eggs", ".git", ".ipynb_checkpoints", ".pyenv", ".pytest_cache", ".ruff_cache", ".venv", ".vscode", "build", "dist", "api"]
line-length = 120
indent-width = 4
target-version = "py310"
cache-dir = "~/.cache/ruff"
fix = true
extend-select = ["I"]
src = ["python"]
namespace-packages = ["python/clay"]
ignore-init-module-imports = true

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["python/clay"]
exclude = ["*env", "**/node_modules", "**/__pycache__", "python/tests", "api", "pkg", "cmd"]
useLibraryCodeForTypes = true
reportSelfClsParameterName = false

[tool.pytest.ini_options]
filterwarnings = [
    # generated by asynctest
    "ignore:\"@coroutine\"*:DeprecationWarning:"
]
