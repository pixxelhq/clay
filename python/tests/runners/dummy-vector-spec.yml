kind: block
type: processing
description: dummy block spec for testing
name: M
resources:
  cpu:
    min: 2000m
    max: 3000m
  mem:
    min: 1200Mi
    max: 2000Mi
build:
  python-version: "3.10"
  conda: true
  gdal: true
  requirements: requirements.txt

env:
  MODEL_CONTAINER_TOKEN: "string"
  OUTPUT_CONTAINER_TOKEN: "string"

inputs:
  - format: vector
    type: url
    name: vector_string
  - format: vector
    type: url
    name: vector_file
    is_artifact: true
outputs:
  - format: string
    type: str
    name: string

runtime_opts:
  image: some-image:latest
  K8sJobConfig: null

options:
  dry_run: null
  preview: null
  generate_k8s_spec: true
