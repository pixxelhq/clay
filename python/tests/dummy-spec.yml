kind: block
type: processing
description: dummy block spec for testing
name: M
resources:
  cpu:
    min: 2000m
    max: 3000m
  mem:
    min: 1200Mi
    max: 2000Mi
build:
  python-version: "3.10"
  conda: true
  gdal: true
  requirements: requirements.txt
env:
  MODEL_CONTAINER_TOKEN: ""
  OUTPUT_CONTAINER_TOKEN: ""
inputs:
  - format: raster
    type: url
    name: raster
    is_artiface: true
  - format: string
    type: str
    name: string
  - format: vector
    type: url
    name: vector
    is_artiface: true
outputs:
  - format: raster
    type: url
    name: result
    is_artiface: true
  - format: string
    type: str
    name: string
  - format: vector
    type: url
    name: vector
    is_artiface: true

runtime_opts:
  image: some-image:latest
  K8sJobConfig: null

options:
  dry_run: null
  preview: null
  generate_k8s_spec: true
