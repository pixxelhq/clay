---
kind: block
type: processing
tags:
  - mathematics
name: Empty Block
description: Returns the input float number as is
author: akash@pixxel.co.in
resources:
  cpu:
    min: 1000m
    max: 4000m
  mem:
    min: 1000Mi
    max: 4000Mi
build:
  python-version: 3.9
  conda: false
  gdal: true
  apt-get:
    - wget
  requirements: requirements.txt
env:
parameters:
inputs:
  - name: x
    format: number
    type: float
    default: 1.0
outputs:
  - name: x
    format: number
    type: float
options:
  dry_run: true
  preview: true
