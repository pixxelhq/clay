---
kind: block
type: processing
tags:
  - mathematics
name: Line Equation
description: Calculate the Y coordinate of a line given X
author: akash@pixxel.co.in
resources:
  cpu:
    min: 1000m
    max: 4000m
  mem:
    min: 1000Mi
    max: 4000Mi
build:
  pythonVersion: 3.9
  conda: false
  gdal: true
  apt-get:
    - wget
  requirements: requirements.txt
env:
parameters:
  - name: slope
    type: float
    default: 1.0
  - name: intercept
    type: float
    default: 0.0
inputs:
  - name: x
    format: number
    type: float
    default: 1.0
  - name: info
    type: string
    dtype: str
    default: "The above computation was carried out."
outputs:
  - name: y_coordinate
    format: number
    type: float
  - name: equation
    format: string
    type: str
options:
  dry_run: true
  preview: true
