name: "Deploy registry [manual]"

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: us-east-2
  ECR_REGISTRY: REDACTED.dkr.ecr.us-east-2.amazonaws.com
  IMAGE_NAME: clay-registry

jobs:
  build:
    runs-on: [ubuntu-latest]
    env:
      AWS_DEFAULT_REGION: us-east-2

    steps:
      - name: Checkout Github Actions
        uses: actions/checkout@main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::REDACTED:role/REDACTED
          role-session-name: samplerolesession
          audience: sigstore
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build docker image
        run: |
          docker build ./registry -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f registry/Dockerfile

      - name: Build, tag and push image to Amazon ECR
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy_staging:
    runs-on: [ubuntu-latest]
    needs: build
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v3
  
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::REDACTED:role/REDACTED
          audience: https://github.com/pixxelhq
          aws-region: ${{env.AWS_DEFAULT_REGION}}
  
      - name: Render helm values
        uses: example/configs-action@main
        with:
          vault_token: "${{ secrets.VAULT_TOKEN }}"
          service: "clay"
          tag: "registry_staging"
          output: ./values.yaml
  
      - name: Helm release clay-registry
        id: deploy
        uses: bitovi/github-actions-deploy-eks-helm@v1.2.6
        with:
          aws-region: us-east-2
          cluster-name: cluster-staging
          config-files: ./values.yaml
          chart-repository: https://raystack.github.io/charts/
          chart-path: raystack/app
          namespace: platform
          name: clay-registry
          values: image.repository=${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }},image.tag=${{ github.sha }},
          helm-wait: false
          timeout: 120s
  
      - name: Announce deployment on slack
        uses: example/deployment-announcer@main
        if: ${{ always() }}
        with:
          status: ${{ steps.deploy.outcome }} #outcome of the last step goes as status
          slack_bot_token: ${{ secrets.ANNOUNCER_BOT_TOKEN }} # should be preset
          image: ${{ env.IMAGE_NAME }}/${{ github.sha }}
          reference: "Env - staging"
