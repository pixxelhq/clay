name: "GitHub CI/CD Pipelines for Clay"

on:
  pull_request:
    branches: ["main"]

jobs:
  ci-all-tests:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          pip install -r python/requirements/requirements-dev.txt
          pip install --index-url ${{ secrets.MATTER_INDEX_URL }} matter
          pip install coverage mypy==0.971 flake8 isort pre-commit
      - name: Run Pytest
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        working-directory: ./python
        run: |
          coverage run -m pytest -v --durations=50 --junitxml=results-${{ runner.os }}-py${{ matrix.python-version }}.xml
      - name: Upload Pytest Results
        if: ${{ !failure() }}
        uses: actions/upload-artifact@v3
        with:
          name: pytest-results-${{ runner.os }}-py${{ matrix.python-version }}
          path: python/results-${{ runner.os }}-py${{ matrix.python-version }}.xml
      - name: Coverage
        working-directory: ./python
        if: ${{ !failure() }}
        run: |
          coverage report
          coverage xml
      - name: Isort Check
        working-directory: ./python
        run: |
          isort . --check
      - name: MyPy Check
        working-directory: ./python
        run: |
          mypy .
      - name: Flake8 Check
        working-directory: ./python
        run: |
          flake8 . --config .flake8
      - name: Docs Build Test
        run: |
          make build-docs
