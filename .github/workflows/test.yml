name: "Tests and lint"

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]

jobs:
  registry-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.22.2
      - name: Test
        run: make test-registry

  ci-go-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.22.2
      - name: Test
        run: make test-go

  ci-python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install Dependencies
        working-directory: ./python
        run: |
          uv pip install --system ../proto/python
          uv pip install --system coverage pre-commit -r requirements/requirements-dev.txt .

      - name: Run Pytest
        working-directory: ./python
        run: |
          coverage run -m pytest -v --durations=50 --junitxml=results-${{ runner.os }}-py${{ matrix.python-version }}.xml

      - name: Upload Pytest Results
        if: ${{ !failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ runner.os }}-py${{ matrix.python-version }}
          path: python/results-${{ runner.os }}-py${{ matrix.python-version }}.xml

      - name: Coverage
        working-directory: ./python
        if: ${{ !failure() }}
        run: |
          coverage report
          coverage xml

      - name: Ruff Check
        uses: chartboost/ruff-action@v1
        with:
          src: "./python"

      - name: Lint with Pyright
        uses: jakebailey/pyright-action@v1
        with:
          version: 1.1.343

      - name: Docs Build Test
        run: |
          make build-docs
