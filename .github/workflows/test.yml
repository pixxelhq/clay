name: "Tests and lint"

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    branches: ["main"]

jobs:
  registry-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.22.2
      - name: Test
        run: make test-registry

  ci-go-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.22.2
      - name: Configure private token url
        env:
          GO_RELEASE_TOKEN: ${{ secrets.GO_RELEASE }}
        run: |
          git config --global url."https://${GO_RELEASE_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      - name: Test
        run: make test-go

  ci-python-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure AWS Credentials for Code Artifact Access
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::REDACTED:role/REDACTED
          audience: sigstore
          aws-region: us-east-2

      - name: Set aws codeartifact token for clay
        id: codeartifact-token
        run: |
          echo "CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain REDACTED-ARTIFACTORY --domain-owner REDACTED-AWS-ACCT --query authorizationToken --region us-east-2 --output text)" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          pip install pixxel-datatypes --extra-index-url https://aws:${CODEARTIFACT_AUTH_TOKEN}@REDACTED.d.codeartifact.us-east-2.amazonaws.com/pypi/python/simple/ -r python/requirements/requirements-dev.txt
          pip install coverage pre-commit

      - name: Run Pytest
        working-directory: ./python
        run: |
          coverage run -m pytest -v --durations=50 --junitxml=results-${{ runner.os }}-py${{ matrix.python-version }}.xml

      - name: Upload Pytest Results
        if: ${{ !failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ runner.os }}-py${{ matrix.python-version }}
          path: python/results-${{ runner.os }}-py${{ matrix.python-version }}.xml

      - name: Coverage
        working-directory: ./python
        if: ${{ !failure() }}
        run: |
          coverage report
          coverage xml

      - name: Ruff Check
        uses: chartboost/ruff-action@v1
        with:
          src: "./python"

      - name: Lint with Pyright
        uses: jakebailey/pyright-action@v1
        with:
          version: 1.1.343

      - name: Docs Build Test
        run: |
          make build-docs
