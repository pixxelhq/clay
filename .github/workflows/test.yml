name: "Tests and lint"

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  registry-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.22.2
      - name: Test
        run: make test-registry

  ci-go-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.22.2
      - name: Test
        run: make test-go

  ci-docker-build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", gdal: true }
          - { python-version: "3.11", gdal: false }
          - { python-version: "3.12", gdal: true }
          - { python-version: "3.12", gdal: false }
    env:
      IMAGE: example:${{ matrix.python-version }}-gdal-${{ matrix.gdal }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: 1.22.2
      - name: Build the CLI
        run: go build -o clay .
      - name: Build the example block with Python ${{ matrix.python-version }}, gdal ${{ matrix.gdal }}
        working-directory: ./examples/raster_vector_clipper
        run: |
          sed -i -e 's/python-version: .*/python-version: "${{ matrix.python-version }}"/' \
                 -e 's/gdal: .*/gdal: ${{ matrix.gdal }}/' clay.yaml
          ../../clay build -t "$IMAGE"
      - name: Check the user, the Python version and the imports
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          [[ "$uid" != "0" ]]
          version=$(docker run --rm --entrypoint python "$IMAGE" --version)
          echo "$version"
          [[ "$version" == "Python ${{ matrix.python-version }}."* ]]
          docker run --rm --entrypoint python "$IMAGE" \
            -c "import block, clay, datatypes, rasterio"
      - name: Check the GDAL Python bindings
        if: matrix.gdal
        run: |
          docker run --rm --entrypoint python "$IMAGE" \
            -c "from osgeo import gdal; gdal.Translate('/tmp/out.tif', gdal.GetDriverByName('MEM').Create('', 2, 2)); print(gdal.__version__)"
      - name: Report the image size
        run: docker image inspect "$IMAGE" --format '{{.Size}}' | numfmt --to=si

  ci-python-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install Dependencies
        working-directory: ./python
        run: |
          uv pip install --system ../proto/python
          uv pip install --system coverage pre-commit -r requirements/requirements-dev.txt .

      - name: Run Pytest
        working-directory: ./python
        run: |
          coverage run -m pytest -v --durations=50 --junitxml=results-${{ runner.os }}-py${{ matrix.python-version }}.xml

      - name: Upload Pytest Results
        if: ${{ !failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ runner.os }}-py${{ matrix.python-version }}
          path: python/results-${{ runner.os }}-py${{ matrix.python-version }}.xml

      - name: Coverage
        working-directory: ./python
        if: ${{ !failure() }}
        run: |
          coverage report
          coverage xml

      - name: Ruff Check
        uses: chartboost/ruff-action@v1
        with:
          src: "./python"

      - name: Lint with Pyright
        uses: jakebailey/pyright-action@v1
        with:
          version: 1.1.343

      - name: Docs Build Test
        run: |
          make build-docs
