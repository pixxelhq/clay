name: Release clay CLI

on:
    push:
      tags:
        - '**'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4

      - name: Verify version matches tag
        run: |
          FILE_VERSION=$(python3 -c "exec(open('python/clay/__version__.py').read()); print(__VERSION__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: python/clay/__version__.py says ${FILE_VERSION} but git tag is ${TAG_VERSION}. Bump __version__.py before tagging."
            exit 1
          fi
          echo "Version check passed: ${FILE_VERSION} matches tag ${GITHUB_REF_NAME}"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
