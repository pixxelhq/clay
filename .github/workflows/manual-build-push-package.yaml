name: "Build and push package to registry"

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

env:
  AWS_ACCOUNT_NUMBER: REDACTED-AWS-ACCT

jobs:
  build-and-push-package:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.8.1"]

    steps:
      - name: Configure AWS Credentials for Code Artifact Access
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_NUMBER }}:role/GithubActionsRole
          audience: sigstore
          aws-region: us-east-2
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python-version}}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install twine build
      - name: Build and publish
        run: |
          export TWINE_PASSWORD=`aws codeartifact get-authorization-token --domain REDACTED-ARTIFACTORY --domain-owner ${{ env.AWS_ACCOUNT_NUMBER }} --query authorizationToken --output text`
          export TWINE_USERNAME=aws
          export REPO_URL=`aws codeartifact get-repository-endpoint --domain REDACTED-ARTIFACTORY --domain-owner ${{ env.AWS_ACCOUNT_NUMBER }} --repository python --format pypi --query repositoryEndpoint --output text`
          python -m build ./python
          python -m twine upload python/dist/* --repository-url=$REPO_URL --verbose --skip-existing
