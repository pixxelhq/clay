name: "Build and push package to registry"

on: workflow_dispatch

jobs:
  build-and-push-package:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.8.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python-version}}
      - name: Make Package
        env:
          CLAY_REGISTRY_NAME: ${{ secrets.CLAY_REGISTRY_NAME }}
          CLAY_REGISTRY_PASS: ${{ secrets.CLAY_REGISTRY_PASS }}
        run: |
          echo $CLAY_REGISTRY_NAME
          echo $CLAY_REGISTRY_PASS
          make package
