apiVersion: 0.0.1
kind: block
type: processing
name: {{ .Name | ToLower }}
version: v0.0.1
author: <please-fill-in-here>
tags:
  - imagery
  - processing

parameters: # block initialization params
  - name: weight
    type: int
    default: 5

inputs:
  - name: input1
    format: string
    type: str

  - name: input2
    format: number
    type: int

outputs:
  - name: output1
    format: number
    type: int

build:
  python-version: "3.10"
  conda: false
  gdal: true
  apt-get:
    - wget
  requirements: requirements.txt

gpu: false

env:
  SAMPLE_ENV: "sample"
