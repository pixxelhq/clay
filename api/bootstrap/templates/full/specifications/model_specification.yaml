kind: block
type: processing
name: {{ .Name }}
description: describe the model
author: <please-fill-in-here>@pixxel.co.in
tags:
  - imagery
  - processing

resources:
  cpu:
    min: 1200m
    max: 4000m
  mem:
    min: 1200Mi
    max: 4000Mi

parameters: # model initialization params
  - name: param1
    type: string
    default: default string
  - name: param2
    type: float
    default: 1.0

inputs:
  - name: raster_url
    format: raster
    type: str
    properties:
      source: planetary
      collection: sentinel2a
      dtype: uint16
      bands:
        - B04
        - B03
        - B02
  - name: boundary
    format: vector
    type: str
    properties:
      geometry: Polygon
  - name: bandlist
    format: string
    type: str
  - name: input4
    format: number
    type: int
  - name: input5
    format: number
    type: float

outputs:
  - name: result1
    format: number
    type: float
  - name: output_raster
    format: raster
    type: str
    properties:
      source: planetary
      collection: sentinel2a
      dtype: uint16
      bands:
        - B04
        - B03
        - B02

build:
  python-version: "3.10"
  conda: false
  gdal: true
  apt-get:
    - wget
  requirements: requirements.txt # or conda-env.yml

runtime_opts:
  image: {{ .Name | ToLower }}:latest
  K8sJobConfig: null

options:
  dry_run: null
  preview: null
  generate_k8s_spec: true
