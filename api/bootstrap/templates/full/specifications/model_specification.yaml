kind: block
type: processing
name: {{ .Name }}
description: describe the model
author: <please-fill-in-here>@pixxel.co.in
tags:
  - imagery
  - processing

resources:
  cpu:
    min: 1200m
    max: 4000m
  mem:
    min: 1200Mi
    max: 4000Mi

parameters: # model initialization params
  - name: param1
    type: string
    default: default string
  - name: param2
    type: float
    default: 1.0

inputs:
  - name: raster_url
    format: raster
    type: string
    properties:
      source: planetary
      collection: sentinel2a
      dtype: uint16
      bands:
        - B04
        - B03
        - B02
  - name: bandlist
    type: str
    default: "B04 B03 B02"
  - name: input3
    type: float
    default: 0.3

output:
  - name: result
    type: float

build:
  python-version: 3.10
  conda: false
  gdal: true
  apt-get:
    - wget
  requirements: requirements.txt # or conda-env.yml

options:
  dry_run: null
  preview: null
