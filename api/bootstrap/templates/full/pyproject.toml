[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["{{.BlockName | ToSnake}}"]
exclude = ["**/node_modules", "**/.*", "*env", "**/__pycache__", "tests", "build", "dist"]

[tool.pytest.ini_options]
pythonpath = [
  ".", "{{.BlockName | ToSnake}}"
]
