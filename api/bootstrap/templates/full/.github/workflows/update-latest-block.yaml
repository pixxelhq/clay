name: "Update latest block"

on:
  workflow_dispatch:
    inputs:
      build-new-docker:
        description: "Build new docker image"
        type: choice
        required: true
        options:
            - false
            - true
      docker-tag:
        description: "Custom Docker Tag (For Dev Release)"
        required: false
      environment:
        description: "Env to which the block is to be added"
        type: choice
        default: development
        options:
          - development
          - staging

env:
  AWS_DEFAULT_REGION: us-east-2
  ECR_REGISTRY: REDACTED.dkr.ecr.us-east-2.amazonaws.com
  Frontier_Sub: {{ "${{ secrets.AUTH_SUB }}" }}
  Frontier_Org_Ids: {{ "${{ secrets.AUTH_ORG_IDS }}" }}
  VERSION: {{ "${{ github.event.inputs.version }}" }}

jobs:
  image-build-push-dev:
    runs-on: [ubuntu-latest]
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development' && github.event.inputs.build-new-docker == 'true')
    permissions:
      id-token: write
      contents: write
    outputs:
      img-tag: {{ "${{ steps.persist_img_tag.outputs.IMG_TAG }}" }}
    steps:
      - name: Set SHA as docker tag(dev)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.docker-tag == '')
        env:
          SHA: {{ "${{ github.sha }}" }}
        run: |
          echo "IMAGE_TAG=$SHA" >> $GITHUB_ENV

      - name: Set user given docker tag(dev)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.docker-tag != '')
        env:
          TAG: {{ "${{ github.event.inputs.docker-tag }}" }}
        run: |
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Persist Image Tag across Jobs
        id: persist_img_tag
        env:
          TAG: {{ "${{ env.IMAGE_TAG }}" }}
        run: |
          echo "IMG_TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@b8c74de753fbcb4868bf2011fb2e15826ce973af
        with:
          role-to-assume: arn:aws:iam::REDACTED:role/REDACTED
          role-session-name: samplerolesession
          aws-region: {{ "${{ env.AWS_DEFAULT_REGION }}" }}

      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to AWS Container Registry
        id: login-ecr
        uses: docker/login-action@v2
        with:
          registry: {{ "${{ env.ECR_REGISTRY }}" }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::REDACTED:role/REDACTED
          audience: sigstore
          aws-region: us-east-2


      - name: Set aws codeartifact token for clay
        id: codeartifact-token
        run: |
          echo "CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain REDACTED-ARTIFACTORY --domain-owner REDACTED-AWS-ACCT --query authorizationToken --region us-east-2 --output text)" >> "$GITHUB_ENV"

      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: true
          secrets: |
              CODEARTIFACT_AUTH_TOKEN={{ "${{ env.CODEARTIFACT_AUTH_TOKEN }}" }}
          tags: |
              {{ "${{ env.ECR_REGISTRY }}" }}/{{ .ModelName }}:{{ "${{ env.IMAGE_TAG }}" }}


  update-docker-in-specfile-dev:
    needs: [image-build-push-dev]
    runs-on: [ubuntu-latest]
    env:
      ARN: REDACTED-AWS-ACCT
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development' && needs.image-build-push-dev.result == 'success' )
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::{{ "${{ env.ARN }}" }}:role/GithubDeployRole
          audience: https://github.com/pixxelhq
          aws-region: {{ "${{ env.AWS_DEFAULT_REGION }}" }}


      - name: Get Image tag
        id: image_tag
        run: |
          IMAGE_TAG={{ "${{ needs.image-build-push-dev.outputs.img-tag }}" }}
          echo "$IMAGE_TAG"
          echo "::set-output name=value::$IMAGE_TAG"


      - name: Create local changes
        run: |
            sed -i "s|image:.*|image: \"{{ "${{ env.ECR_REGISTRY }}" }}/{{ .ModelName }}:{{ "${{ steps.image_tag.outputs.value }}" }}\"|" {{ .ModelName }}/specifications/model_specification_dev.yaml

      - name: Commit files
        run: |
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git commit -a -m "updated image + catalog url + version"

      - name: Push changes back to github
        uses: ad-m/github-push-action@master
        with:
            github_token: {{ "${{ secrets.GITHUB_TOKEN }}" }}
            branch: {{ "${{ github.ref }}" }}

  update-block-in-dev:
    if: {{ "${{ always() && github.event.inputs.environment == 'development' }}" }}
    needs: [image-build-push-dev, update-docker-in-specfile-dev]
    runs-on: [ubuntu-latest]
    env:
      ARN: REDACTED-AWS-ACCT

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::{{ "${{ env.ARN }}" }}:role/GithubDeployRole
          audience: https://github.com/pixxelhq
          aws-region: {{ "${{ env.AWS_DEFAULT_REGION }}" }}

      - name: Download Clay Binaries
        uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
            repo: example/clay
            tag: v0.4.0
            token: {{ "${{ secrets.CLAY_BIN_DOWNLOAD_TOKEN}}" }}
            extension-matching: disable
            platform: linux
            arch: amd64
            rename-to: clay
            chmod: 0755

      - name: read-spec-file
        uses: pietrobolcato/action-read-yaml@1.1.0
        id: read_action_js
        with:
            config: {{ "${{ github.workspace }}" }}/{{ .ModelName }}/specifications/model_specification_dev.yaml

      - name: Update model on orchestrator
        run: |
          clay update block {{ .ModelName }}/specifications/model_specification_dev.yaml -n {{ .ModelName }} -v {{ "${{ steps.read_action_js.outputs['version'] }}" }} --env dev


  update-block-in-stg:
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: [ubuntu-latest]
    env:
        ARN: REDACTED-AWS-ACCT

    permissions:
        id-token: write
        contents: write

    steps:
      - uses: actions/checkout@v2
        with:
            persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
            fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
            role-to-assume: arn:aws:iam::{{ "${{ env.ARN }}" }}:role/GithubDeployRole
            audience: https://github.com/pixxelhq
            aws-region: {{ "${{ env.AWS_DEFAULT_REGION }}" }}

      - name: Download Clay Binaries
        uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
            repo: example/clay
            tag: v0.3.10-alpha.8
            token: {{ "${{ secrets.CLAY_BIN_DOWNLOAD_TOKEN}}" }}
            extension-matching: disable
            platform: linux
            arch: amd64
            rename-to: clay
            chmod: 0755

      - name: read-spec-file
        uses: pietrobolcato/action-read-yaml@1.1.0
        id: read_action_js
        with:
            config: {{ "${{ github.workspace }}" }}/{{ .ModelName }}/specifications/model_specification_stg.yaml

      - name: Update model on orchestrator
        run: |
            clay update block {{ .ModelName }}/specifications/model_specification_stg.yaml -n {{ .ModelName }} -v {{ "${{ steps.read_action_js.outputs['version'] }}" }} --env stg
