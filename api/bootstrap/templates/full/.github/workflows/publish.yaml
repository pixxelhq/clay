name: Publish block to Clay registry

# This workflow is a starting point and assumes an AWS deployment. The
# account-specific values below are sourced from repository/organization
# secrets and variables so the template itself stays cloud-agnostic. Either
# configure the referenced secrets/vars or adapt the workflow to your own
# infrastructure (GCP, Azure, etc.). Required configuration:
#   vars.CLAY_REGISTRY_HOST        - Clay registry URL
#   vars.AWS_REGION                - AWS region (e.g. us-east-2)
#   vars.CATALOG_S3_BUCKET         - S3 bucket for block catalog assets
#   vars.ECR_REGISTRY              - ECR registry host (e.g. 123456789012.dkr.ecr.us-east-2.amazonaws.com)
#   vars.GITHUB_OIDC_AUDIENCE      - OIDC audience configured in the IAM trust policy
#   secrets.AWS_ACCOUNT_ID         - AWS account that hosts the deploy/publish roles
#   secrets.CLAY_BIN_DOWNLOAD_TOKEN - PAT used to fetch the clay CLI release

on: workflow_dispatch

env:
  CLAY_REGISTRY_HOST: ${{`{{ vars.CLAY_REGISTRY_HOST }}`}}
  CLAY_CLI_VERSION: {{ .Version }}
  AWS_DEFAULT_REGION: ${{`{{ vars.AWS_REGION }}`}}
  ECR_REGISTRY: ${{`{{ vars.ECR_REGISTRY }}`}}

permissions:
  id-token: write
  contents: write

jobs:
  publish-block-doc:
    runs-on: [ubuntu-latest]
    outputs:
      doc-url: ${{ `{{steps.upload_assets.outputs.DOC_URL}}` }}
      thumbnail-url: ${{ `{{steps.upload_assets.outputs.THUMBNAIL_URL}}` }}
    if: (github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{`{{ secrets.AWS_ACCOUNT_ID }}`}}:role/GithubDeployRole
          audience: ${{`{{ vars.GITHUB_OIDC_AUDIENCE }}`}}
          aws-region: ${{`{{ env.AWS_DEFAULT_REGION }}`}}

      - name: Download Clay Binaries
        uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
          repo: example/clay
          tag: ${{`{{ env.CLAY_CLI_VERSION }}`}}
          token: ${{`{{ secrets.CLAY_BIN_DOWNLOAD_TOKEN }}`}}
          extension-matching: disable
          platform: linux
          arch: amd64
          rename-to: clay
          chmod: 0755

      - name: Upload block assets to s3
        id: upload_assets
        run: |
          set -e
          # Upload catalog (readme and thumbnail)
          # Version is automatically read from clay.yaml config when --readme flag is set
          BASE_URL=$(clay block assets upload catalog --name {{ .BlockName }} --bucket ${{`{{ vars.CATALOG_S3_BUCKET }}`}} --region ${{`{{ vars.AWS_REGION }}`}} --readme)

          # Construct full URLs with specific file paths
          DOC_URL="${BASE_URL}/parsed.md"
          THUMBNAIL_URL="${BASE_URL}/thumbnail.png"

          echo "DOC_URL=$DOC_URL" >> $GITHUB_OUTPUT
          echo "THUMBNAIL_URL=$THUMBNAIL_URL" >> $GITHUB_OUTPUT

          echo "Documentation URL: $DOC_URL"
          echo "Thumbnail URL: $THUMBNAIL_URL"

  publish-block:
    needs: publish-block-doc
    runs-on: [ubuntu-latest]
    if: (github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{`{{ secrets.AWS_ACCOUNT_ID }}`}}:role/GithubActionsRole
          audience: ${{`{{ vars.GITHUB_OIDC_AUDIENCE }}`}}
          aws-region: ${{`{{ env.AWS_DEFAULT_REGION }}`}}

      - name: Login to AWS Container Registry
        id: login-ecr
        uses: docker/login-action@v2
        with:
          registry: ${{`{{ env.ECR_REGISTRY }}`}}

      - name: Download clay binaries
        uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
          repo: example/clay
          tag: ${{`{{ env.CLAY_CLI_VERSION }}`}}
          token: ${{`{{ secrets.CLAY_BIN_DOWNLOAD_TOKEN}}`}}
          extension-matching: disable
          platform: linux
          arch: amd64
          rename-to: clay
          chmod: 0755

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish block to clay registry
        run: |
          DOC_URL=${{`{{ needs.publish-block-doc.outputs.doc-url }}`}}
          THUMBNAIL_URL=${{`{{ needs.publish-block-doc.outputs.thumbnail-url }}`}}
          echo "Documentation URL: $DOC_URL"
          echo "Thumbnail URL: $THUMBNAIL_URL"
          clay publish --block-registry-host=${{`{{env.CLAY_REGISTRY_HOST}}`}} --documentation-url=$DOC_URL --thumbnail-url=$THUMBNAIL_URL
