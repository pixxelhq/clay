name: Publish model to Clay registry

on:
  workflow_dispatch

env:
  CLAY_REGISTRY_HOST: clay-registry-sandbox.example.com
  AWS_DEFAULT_REGION: us-east-2
  ECR_REGISTRY: REDACTED.dkr.ecr.us-east-2.amazonaws.com

permissions:
    id-token: write
    contents: read

jobs:
  publish:
    runs-on: [ubuntu-latest]
    if: (github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@b8c74de753fbcb4868bf2011fb2e15826ce973af
        with:
          role-to-assume: arn:aws:iam::REDACTED:role/REDACTED
          role-session-name: samplerolesession
          aws-region: {{ "${{ env.AWS_DEFAULT_REGION }}" }}

      - name: Login to AWS Container Registry
        id: login-ecr
        uses: docker/login-action@v2
        with:
          registry: {{ "${{ env.ECR_REGISTRY }}" }}
      
      - name: Download clay binaries
        uses: jaxxstorm/action-install-gh-release@v1.10.0
        with:
            repo: example/clay
            tag: v0.5.0-alpha
            token: {{ "${{ secrets.CLAY_BIN_DOWNLOAD_TOKEN}}" }}
            extension-matching: disable
            platform: linux
            arch: amd64
            rename-to: clay
            chmod: 0755 

      - name: Publish model to clay regitry
        run: |
          clay publish --model-registry-host=${{env.CLAY_REGISTRY_HOST}}



      
    


