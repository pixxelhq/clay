name: "Build model"

on:
  workflow_dispatch

permissions:
    id-token: write
    contents: read

jobs:
  building-test-docker:
    runs-on: [ubuntu-latest]
    steps:

      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::REDACTED:role/REDACTED
          audience: sigstore
          aws-region: us-east-2

      - name: Set aws codeartifact token for clay
        id: codeartifact-token
        run: |
          echo "CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain REDACTED-ARTIFACTORY --domain-owner REDACTED-AWS-ACCT --query authorizationToken --region us-east-2 --output text)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v2
      - name: Build the Docker image
        run: |
          docker build --secret id=CODEARTIFACT_AUTH_TOKEN,env={{ "${{ secrets.CODEARTIFACT_AUTH_TOKEN }}" }} --tag modeltest .
