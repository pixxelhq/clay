version: "2"
sql:
- schema: "./internal/store/migrations/"
  queries: "./internal/store/query/"
  engine: "postgresql"
  gen:
    go:
      package: "store"
      out: "/internal/store/sqlc"
      emit_prepared_queries: false
      emit_interface: true
      emit_exact_table_names: false
      emit_empty_slices: true