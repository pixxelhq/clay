host: localhost:8080
info:
  contact:
    email: mlops@pixxel.co.in
    name: MLOps team
  title: Clay Registry
  version: "1.0"
paths:
  /v1/blocks:
    get:
      description: Return all the blocks with latest version.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RegistryResponse-http_GetLatestBlocksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
      summary: Get the latest blocks from the registry
      tags:
      - Block
    post:
      description: publish the specific version of the block.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RegistryResponse-http_CreateBlockResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
      summary: Publish the block to clay registry
      tags:
      - Block
  /v1/blocks/{name}:
    get:
      description: Returns all the versions of the block name.
      parameters:
      - description: Name of the block
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RegistryResponse-http_GetBlockByNameResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
      summary: Get block by name.
      tags:
      - Block
  /v1/blocks/{name}/versions/{version}:
    get:
      description: Returns the block for the given version and name.
      parameters:
      - description: Name of the block
        in: path
        name: name
        required: true
        type: string
      - description: Version of the block
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RegistryResponse-http_GetBlockVersion'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/http.RegistryResponse-any'
      summary: Get block by name and version.
      tags:
      - Block
swagger: "2.0"
