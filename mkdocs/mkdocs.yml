site_name: Clay Documentation
site_description: Open-source framework for packaging and deploying ML models
site_url: https://pixxelhq.github.io/clay/
repo_name: pixxelhq/clay
repo_url: https://github.com/pixxelhq/clay
edit_uri: edit/main/mkdocs/docs/

theme:
  name: material
  # logo: img/favicon.png
  # favicon: img/favicon.png

  # Color palette
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Font configuration
  font:
    text: Roboto
    code: Roboto Mono

  # Features for better navigation and UX
  features:
    # Navigation
    - navigation.instant        # Instant loading (SPA-like)
    - navigation.tracking       # URL updates with scroll
    - navigation.tabs           # Top-level sections as tabs
    - navigation.tabs.sticky    # Tabs stay visible when scrolling
    # - navigation.sections       # Render top-level sections as group
    - navigation.path           # Show path breadcrumbs
    - navigation.indexes        # Allow section index pages
    - navigation.top            # Back to top button
    - navigation.footer         # Footer with prev/next links

    # Search
    - search.suggest            # Search suggestions
    - search.highlight          # Highlight search terms
    - search.share              # Share search results

    # Table of contents
    - toc.follow                # TOC follows scrolling
    - toc.integrate             # Integrate TOC into navigation

    # Code blocks
    - content.code.copy         # Copy button for code blocks
    - content.code.annotate     # Allow annotations in code blocks

    # Content
    - content.tabs.link         # Link content tabs across pages
    - content.tooltips          # Improved tooltips

  # Icon configuration
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
markdown_extensions:
  # Python Markdown extensions
  - abbr                        # Abbreviations with tooltips
  - admonition                  # Callout blocks
  - attr_list                   # Add HTML attributes to elements
  - def_list                    # Definition lists
  - footnotes                   # Footnote support
  - md_in_html                  # Markdown inside HTML
  - tables                      # Table support
  - toc:
      permalink: true           # Add permalink to headings
      permalink_title: Link to this section
      toc_depth: 3              # Show up to h3 in TOC

  # PyMdown Extensions
  - pymdownx.arithmatex:        # LaTeX math support
      generic: true
  - pymdownx.betterem:          # Better emphasis handling
      smart_enable: all
  - pymdownx.caret              # Superscript with ^^
  - pymdownx.mark               # Highlighting with ==
  - pymdownx.tilde              # Subscript with ~~
  - pymdownx.critic             # Track changes
  - pymdownx.details            # Collapsible blocks
  - pymdownx.emoji:             # Emoji support
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:         # Syntax highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
      linenums: true
  - pymdownx.inlinehilite       # Inline code highlighting
  - pymdownx.keys               # Keyboard keys
  - pymdownx.magiclink:         # Auto-link URLs
      repo_url_shorthand: true
      user: pixxelhq
      repo: clay
  - pymdownx.smartsymbols       # Smart symbols
  - pymdownx.snippets:          # Include snippets
      check_paths: true
  - pymdownx.superfences:       # Enhanced code blocks
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:            # Content tabs
      alternate_style: true
  - pymdownx.tasklist:          # Task lists
      custom_checkbox: true
      clickable_checkbox: false

extra:
  version:
    provider: mike

  # Social links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pixxelhq/clay
      name: Clay on GitHub

  # Analytics (optional - add your Google Analytics ID)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

  # Custom styling
  generator: false  # Hide "Made with Material for MkDocs"

  # Consent (for GDPR compliance if using analytics)
  # consent:
  #   title: Cookie consent
  #   description: >-
  #     We use cookies to recognize your repeated visits and preferences, as well
  #     as to measure the effectiveness of our documentation and whether users
  #     find what they're searching for. With your consent, you're helping us to
  #     make our documentation better.

# Custom CSS for enhanced styling
extra_css:
  - stylesheets/extra.css

# Custom JavaScript (optional)
# extra_javascript:
#   - javascripts/extra.js

plugins:
  # Enhanced search with better algorithms
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
      lang:
        - en

  # Auto-reference linking
  - autorefs

  # Git revision date for last updated timestamps (optional)
  # Uncomment if you want to show last updated dates
  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: timeago

  # API documentation generation
  - mkdocstrings:
      enable_inventory: true
      handlers:
        python:
          paths: ["../python"]
          inventories:
            - url: https://docs.python-requests.org/en/master/objects.inv
              domains: [py, std]
            - url: https://docs.python.org/3/objects.inv
              domains: [py, std]
            - url: https://docs.pydantic.dev/latest/objects.inv
              domains: [py, std]
            - url: https://typing-extensions.readthedocs.io/en/latest/objects.inv
              domains: [py, std]
          options:
            docstring_style: google
            show_root_toc_entry: false
            heading_level: 4
            show_source: true
            show_bases: false
            show_object_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            merge_init_into_class: true
            separate_signature: true

nav:
  - Home: "index.md"
  - Getting Started: "getting-started.md"
  - Core Concepts:
    - Overview: "overview.md"
    - Input/Output & Datatypes: "IO.md"
    - Block Specification: "spec.md"
    - Environment Variables: "env-requirements.md"
    - Clay Registry: "registry.md"
    - Block Assets: "block-assets.md"
  - Tutorial:
    - Block Development Tutorial: "block-development.md"
    - Indicating Progress: "progress.md"
  - Reference:
    - CLI Reference: "cli-reference.md"
    - Logging: "logging.md"
  - FAQs: "faq.md"
